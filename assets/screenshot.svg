  <rect x="898" y="115" width="270" height="70" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="912" y="135" fill="#a1a1aa" font-family="sans-serif" font-size="11">Achieved Speedup</text>
  <text x="912" y="168" fill="#10b981" font-family="monospace" font-size="24" font-weight="900">4.18x</text>
  <text x="980" y="167" fill="#71717a" font-family="monospace" font-size="11">vs PyTorch 2.3</text>

  <!-- Metric Card 2 -->
  <rect x="898" y="195" width="270" height="70" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="912" y="215" fill="#a1a1aa" font-family="sans-serif" font-size="11">Kernel Latency</text>
  <text x="912" y="248" fill="#fbbf24" font-family="monospace" font-size="24" font-weight="900">92.4 μs</text>
  <text x="1010" y="247" fill="#71717a" font-family="monospace" font-size="11">(-294.1 μs)</text>

  <!-- Metric Card 3 -->
  <rect x="898" y="275" width="270" height="70" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="912" y="295" fill="#a1a1aa" font-family="sans-serif" font-size="11">Memory Bandwidth</text>
  <text x="912" y="328" fill="#38bdf8" font-family="monospace" font-size="22" font-weight="900">7,296 GB/s</text>
  <text x="1050" y="327" fill="#71717a" font-family="monospace" font-size="10">91.2% Roof</text>

  <!-- Numerical Verification Badge -->
  <rect x="898" y="355" width="270" height="40" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="912" y="380" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">✓ Numerical Test Passed (Δmax: 3.8e-4)</text>

  <!-- Evolution Controls -->
  <rect x="898" y="585" width="270" height="45" rx="6" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  <text x="1033" y="612" fill="#09090b" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">⚡ Evolve Next Generation</text>
</svg>
