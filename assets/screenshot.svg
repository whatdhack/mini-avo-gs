  <!-- DAG Nodes -->
  <!-- Root -->
  <circle cx="400" cy="200" r="16" fill="#27272a" stroke="#71717a" stroke-width="2"/>
  <text x="400" y="204" fill="#a1a1aa" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">v0</text>

  <!-- Gen 1 -->
  <circle cx="500" cy="160" r="14" fill="#27272a" stroke="#ef4444" stroke-width="2"/>
  <text x="500" y="164" fill="#ef4444" font-family="monospace" font-size="9" text-anchor="middle">ERR</text>

  <circle cx="500" cy="260" r="16" fill="#18181b" stroke="#10b981" stroke-width="2"/>
  <text x="500" y="264" fill="#10b981" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">v1</text>

  <!-- Gen 2 -->
  <circle cx="620" cy="320" r="14" fill="#27272a" stroke="#71717a" stroke-width="1.5"/>
  <text x="620" y="324" fill="#a1a1aa" font-family="monospace" font-size="9" text-anchor="middle">v2b</text>

  <circle cx="620" cy="230" r="16" fill="#18181b" stroke="#10b981" stroke-width="2"/>
  <text x="620" y="234" fill="#10b981" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">v3</text>

  <!-- Elite Leaf -->
  <circle cx="750" cy="200" r="22" fill="#2d2208" stroke="#f59e0b" stroke-width="3" filter="url(#glow)"/>
  <text x="750" y="204" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="900" text-anchor="middle">v4★</text>
  
  <!-- Mini Lineage Callout -->
  <rect x="340" y="420" width="500" height="210" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
  <text x="355" y="445" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="700">ACTIVE MUTATION: 2D Block Swizzle + Split-K</text>
  <text x="355" y="468" fill="#d4d4d8" font-family="sans-serif" font-size="11">Reordered threadblock tile assignment to maximize L2 cache hit rates on 72MB B200 cache.</text>
  <rect x="355" y="485" width="470" height="130" rx="4" fill="#09090b" stroke="#1f1f23" stroke-width="1"/>
  <text x="365" y="505" fill="#71717a" font-family="monospace" font-size="10">@triton.jit</text>
  <text x="365" y="522" fill="#71717a" font-family="monospace" font-size="10">def matmul_kernel_swizzled(a_ptr, b_ptr, c_ptr, M, N, K, ...):</text>
  <text x="385" y="539" fill="#38bdf8" font-family="monospace" font-size="10">pid = tl.program_id(axis=0)</text>
  <text x="385" y="556" fill="#fbbf24" font-family="monospace" font-size="10">pid_m, pid_n = swizzle_2d(pid, num_pid_m, num_pid_n, GROUP_M=8)</text>
  <text x="385" y="573" fill="#10b981" font-family="monospace" font-size="10"># Load with 128-bit vectorization &amp; async pipeline</text>
  <text x="385" y="590" fill="#e4e4e7" font-family="monospace" font-size="10">accumulator = tl.zeros((BLOCK_SIZE_M, BLOCK_SIZE_N), dtype=tl.float32)</text>

  <!-- Right Telemetry Panel -->
  <rect x="884" y="70" width="300" height="585" rx="8" fill="url(#panelGrad)" stroke="#27272a" stroke-width="1"/>
  <text x="900" y="96" fill="#a1a1aa" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">HARDWARE TELEMETRY (B200)</text>

