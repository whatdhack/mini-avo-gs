  <circle cx="32" cy="28" r="14" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2"/>
  <text x="32" y="33" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle">λ</text>
  
  <text x="56" y="33" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">MiniAVO</text>
  <rect x="135" y="18" width="140" height="20" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
  <text x="205" y="32" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">GPU MODE EDITION</text>

  <!-- Target Hardware Badge -->
  <rect x="830" y="15" width="220" height="26" rx="6" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <circle cx="845" cy="28" r="4" fill="#10b981"/>
  <text x="858" y="32" fill="#e4e4e7" font-family="monospace" font-size="11" font-weight="600">NVIDIA B200 SXM (8 TB/s)</text>
  
  <!-- Export Button -->
  <rect x="1065" y="15" width="115" height="26" rx="6" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  <text x="1122" y="32" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Export Harness</text>

  <!-- Left Sidebar (Problem & Population) -->
  <rect x="16" y="70" width="280" height="585" rx="8" fill="url(#panelGrad)" stroke="#27272a" stroke-width="1"/>
  <text x="32" y="96" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1">BENCHMARK PROBLEM</text>
  
  <rect x="28" y="110" width="256" height="68" rx="6" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="40" y="132" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">matmul_v2 (Dense GEMM)</text>
  <text x="40" y="150" fill="#a1a1aa" font-family="sans-serif" font-size="11">4096 x 4096 x 4096 FP16 / BF16</text>
  <text x="40" y="166" fill="#10b981" font-family="monospace" font-size="10">GPU MODE Official Problem #1</text>

  <!-- Generation / Variants List -->
  <text x="32" y="210" fill="#a1a1aa" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">EVOLUTION HISTORY (GEN 4)</text>
  
  <!-- Variant 1 (Elite) -->
  <rect x="28" y="225" width="256" height="54" rx="6" fill="#1e1e24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="40" y="245" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700">v4_swizzle_tma_splitk ★</text>
  <text x="40" y="263" fill="#10b981" font-family="monospace" font-size="11">92.4 μs (4.18x) • 91.2% Roof</text>

  <!-- Variant 2 -->
  <rect x="28" y="287" width="256" height="54" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="40" y="307" fill="#e4e4e7" font-family="monospace" font-size="11" font-weight="600">v3_mma_async_pipeline</text>
  <text x="40" y="325" fill="#a1a1aa" font-family="monospace" font-size="11">128.6 μs (3.00x) • 65.5% Roof</text>

  <!-- Variant 3 -->
  <rect x="28" y="349" width="256" height="54" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="40" y="369" fill="#e4e4e7" font-family="monospace" font-size="11" font-weight="600">v2_tile_128x128_vec4</text>
  <text x="40" y="387" fill="#a1a1aa" font-family="monospace" font-size="11">194.2 μs (1.98x) • 43.4% Roof</text>

  <!-- Middle Area: Main Lineage DAG & Workspace -->
  <rect x="310" y="70" width="560" height="585" rx="8" fill="url(#panelGrad)" stroke="#27272a" stroke-width="1"/>
  
  <!-- Tabs -->
  <rect x="322" y="82" width="110" height="28" rx="4" fill="#27272a"/>
  <text x="377" y="100" fill="#f4f4f5" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Lineage DAG</text>
  <text x="480" y="100" fill="#71717a" font-family="sans-serif" font-size="11" font-weight="500">Roofline Model</text>
  <text x="590" y="100" fill="#71717a" font-family="sans-serif" font-size="11" font-weight="500">Code &amp; Diff</text>
  <text x="700" y="100" fill="#71717a" font-family="sans-serif" font-size="11" font-weight="500">GPU MODE Harness</text>

  <!-- Visual DAG representation -->
